<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা FAQ বট | Bengali AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-dark: #5568d3;
            --secondary: #f093fb;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-light: #f8f9ff;
            --bg-dark: #0f0f23;
            --surface: #ffffff;
            --surface-dark: #1a1a2e;
            --text: #2d3748;
            --text-light: #718096;
            --text-dark: #e2e8f0;
            --border: #e2e8f0;
            --shadow: rgba(102, 126, 234, 0.1);
            --shadow-lg: rgba(102, 126, 234, 0.2);
            --success: #48bb78;
            --error: #f56565;
            --user-msg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bot-msg: #f7fafc;
        }

        body {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.05;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23667eea' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            animation: slide 20s linear infinite;
        }

        @keyframes slide {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            padding: 24px 28px;
            box-shadow: 0 4px 20px var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 2px solid var(--border);
        }

        .header-icon {
            width: 56px;
            height: 56px;
            background: var(--bg-gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 12px var(--shadow-lg);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .header-content h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .header-content p {
            font-size: 14px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Category Pills */
        .categories {
            background: var(--surface);
            padding: 16px 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            scrollbar-width: thin;
            scrollbar-color: var(--primary-dark) var(--border);
        }

        .categories::-webkit-scrollbar {
            height: 6px;
        }

        .categories::-webkit-scrollbar-track {
            background: var(--border);
            border-radius: 3px;
        }

        .categories::-webkit-scrollbar-thumb {
            background: var(--primary-dark);
            border-radius: 3px;
        }

        .category-pill {
            padding: 8px 16px;
            background: var(--bg-light);
            border: 2px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text);
        }

        .category-pill:hover {
            background: var(--bg-gradient);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-lg);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            background: var(--surface);
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-dark) var(--border);
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: var(--border);
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--primary-dark);
            border-radius: 4px;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .avatar.user-avatar {
            background: var(--bg-gradient);
            box-shadow: 0 4px 12px var(--shadow-lg);
        }

        .avatar.bot-avatar {
            background: var(--bg-light);
            border: 2px solid var(--border);
        }

        .message-content {
            flex: 1;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px var(--shadow-lg);
        }

        .message.bot .message-bubble {
            background: var(--bot-msg);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-light);
        }

        .meta-badge {
            padding: 4px 10px;
            background: var(--bg-light);
            border-radius: 10px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .welcome-message h2 {
            font-size: 24px;
            color: var(--text);
            margin-bottom: 12px;
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-message p {
            font-size: 15px;
            margin-bottom: 24px;
        }

        .sample-questions {
            display: grid;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .sample-question {
            padding: 14px 20px;
            background: var(--bg-light);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 14px;
            color: var(--text);
        }

        .sample-question:hover {
            background: var(--bg-gradient);
            color: white;
            border-color: transparent;
            transform: translateX(8px);
            box-shadow: 0 4px 12px var(--shadow-lg);
        }

        /* Input Area */
        .input-area {
            background: var(--surface);
            padding: 20px 24px;
            border-radius: 0 0 20px 20px;
            border-top: 2px solid var(--border);
            box-shadow: 0 -4px 20px var(--shadow);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-container {
            flex: 1;
            position: relative;
        }

        #userInput {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border);
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Hind Siliguri', sans-serif;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            background: var(--bg-light);
            color: var(--text);
            max-height: 120px;
        }

        #userInput:focus {
            border-color: var(--primary-dark);
            box-shadow: 0 0 0 3px var(--shadow);
            background: white;
        }

        #sendBtn {
            padding: 14px 28px;
            background: var(--bg-gradient);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow-lg);
            white-space: nowrap;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-lg);
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading Animation */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary-dark);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* Error Message */
        .error-message {
            padding: 12px 16px;
            background: rgba(245, 101, 101, 0.1);
            border: 1px solid var(--error);
            border-radius: 12px;
            color: var(--error);
            font-size: 14px;
            margin-top: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header {
                padding: 16px 20px;
                border-radius: 16px 16px 0 0;
            }

            .header-icon {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .header-content h1 {
                font-size: 20px;
            }

            .message {
                max-width: 90%;
            }

            .categories {
                padding: 12px 16px;
            }

            .input-area {
                padding: 16px;
                border-radius: 0 0 16px 16px;
            }

            #sendBtn {
                padding: 14px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">🤖</div>
            <div class="header-content">
                <h1>বাংলা FAQ বট</h1>
                <p>
                    <span class="status-indicator"></span>
                    <span id="statusText">সক্রিয় এবং সাহায্যের জন্য প্রস্তুত</span>
                </p>
            </div>
        </div>

        <!-- Categories -->
        <div class="categories" id="categories">
            <div class="category-pill" onclick="askSampleQuestion('প্রাথমিক শিক্ষা কত বছরের হয়?')">📚 শিক্ষা</div>
            <div class="category-pill" onclick="askSampleQuestion('সুস্থ থাকার মূল উপায় কী?')">🏥 স্বাস্থ্য</div>
            <div class="category-pill" onclick="askSampleQuestion('কক্সবাজারের বিশেষত্ব কী?')">✈️ ভ্রমণ</div>
            <div class="category-pill" onclick="askSampleQuestion('এআই (AI) বলতে কী বোঝো?')">💻 প্রযুক্তি</div>
            <div class="category-pill" onclick="askSampleQuestion('বাংলাদেশের সবচেয়ে জনপ্রিয় খেলা কোনটি?')">⚽ খেলাধুলা</div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-message" id="welcomeMessage">
                <h2>স্বাগতম! 👋</h2>
                <p>আমি আপনার বাংলা FAQ সহায়ক। আমাকে যেকোনো প্রশ্ন করুন!</p>
                
                <div class="sample-questions">
                    <div class="sample-question" onclick="askSampleQuestion('প্রাথমিক শিক্ষা কত বছরের হয়?')">
                        📚 প্রাথমিক শিক্ষা কত বছরের হয়?
                    </div>
                    <div class="sample-question" onclick="askSampleQuestion('দৈনিক কতটুকু পানি পান করা উচিত?')">
                        💧 দৈনিক কতটুকু পানি পান করা উচিত?
                    </div>
                    <div class="sample-question" onclick="askSampleQuestion('সুন্দরবন কেন বিখ্যাত?')">
                        🌴 সুন্দরবন কেন বিখ্যাত?
                    </div>
                    <div class="sample-question" onclick="askSampleQuestion('স্মার্টফোনের সুবিধা কী?')">
                        📱 স্মার্টফোনের সুবিধা কী?
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <div class="input-container">
                    <textarea 
                        id="userInput" 
                        placeholder="আপনার প্রশ্ন লিখুন..."
                        rows="1"
                        onkeypress="handleKeyPress(event)"
                    ></textarea>
                </div>
                <button id="sendBtn" onclick="sendMessage()">
                    পাঠান 📤
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const statusText = document.getElementById('statusText');

        // Check API health on load
        checkAPIHealth();

        async function checkAPIHealth() {
            try {
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.json();
                
                if (data.status === 'healthy' && data.vector_store_initialized) {
                    statusText.textContent = 'সক্রিয় এবং সাহায্যের জন্য প্রস্তুত';
                } else {
                    statusText.textContent = 'লোড হচ্ছে...';
                }
            } catch (error) {
                statusText.textContent = 'সংযোগ বিচ্ছিন্ন - সার্ভার চালু করুন';
                console.error('API health check failed:', error);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function askSampleQuestion(question) {
            userInput.value = question;
            sendMessage();
        }

        async function sendMessage() {
            const question = userInput.value.trim();
            
            if (!question) return;

            // Hide welcome message
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }

            // Add user message
            addMessage(question, 'user');
            
            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';
            
            // Disable send button
            sendBtn.disabled = true;
            sendBtn.textContent = 'পাঠানো হচ্ছে...';

            // Show typing indicator
            const typingId = showTypingIndicator();

            try {
                const response = await fetch(`${API_URL}/api/ask`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();

                // Remove typing indicator
                removeTypingIndicator(typingId);

                if (response.ok) {
                    // Add bot response with metadata
                    addMessage(data.answer, 'bot', {
                        category: data.category_bangla,
                        difficulty: data.difficulty
                    });
                } else {
                    addMessage('দুঃখিত, একটি ত্রুটি হয়েছে। দয়া করে আবার চেষ্টা করুন।', 'bot');
                }
            } catch (error) {
                removeTypingIndicator(typingId);
                console.error('Error:', error);
                addMessage('দুঃখিত, সার্ভারের সাথে সংযোগ করতে ব্যর্থ। নিশ্চিত করুন যে সার্ভার চালু আছে।', 'bot');
            } finally {
                // Re-enable send button
                sendBtn.disabled = false;
                sendBtn.textContent = 'পাঠান 📤';
                userInput.focus();
            }
        }

        function addMessage(text, sender, metadata = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender}-avatar`;
            avatar.textContent = sender === 'user' ? '👤' : '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            contentDiv.appendChild(bubble);

            // Add metadata for bot messages
            if (sender === 'bot' && metadata) {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'message-meta';

                if (metadata.category) {
                    const categoryBadge = document.createElement('span');
                    categoryBadge.className = 'meta-badge';
                    categoryBadge.innerHTML = `📂 ${metadata.category}`;
                    metaDiv.appendChild(categoryBadge);
                }

                if (metadata.difficulty) {
                    const difficultyBadge = document.createElement('span');
                    difficultyBadge.className = 'meta-badge';
                    const diffIcon = metadata.difficulty === 'easy' ? '🟢' : 
                                   metadata.difficulty === 'medium' ? '🟡' : '🔴';
                    difficultyBadge.innerHTML = `${diffIcon} ${metadata.difficulty}`;
                    metaDiv.appendChild(difficultyBadge);
                }

                contentDiv.appendChild(metaDiv);
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);

            chatContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            const id = 'typing-' + Date.now();
            messageDiv.id = id;

            const avatar = document.createElement('div');
            avatar.className = 'avatar bot-avatar';
            avatar.textContent = '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            bubble.appendChild(typingDiv);
            contentDiv.appendChild(bubble);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return id;
        }

        function removeTypingIndicator(id) {
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
    </script>
</body>
</html>
